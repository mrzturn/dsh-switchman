# =============================================================================
# dsh-switchman bundle patch
#
# One bundle, four preset overrides: each of the four shipped Web presets
# (standard / ptc / minimal / cordis) keeps its exact shipped plugin list and
# gains, in its persona suffix, the dsh-switchman base dispatch doctrine
# (delegation discipline, orchestration/token rules, tiered verification).
# The persona suffix renders as the LAST system-prompt section
# (DEPLOYMENT_PERSONA_SUFFIX, order 10200), after the conservative TEAM_POLICY
# section (order 600) contributed by the Host-level
# @deepseek-ai/dsh-experimental-tool-agent-team, so this doctrine is the
# operative discipline for sessions of every preset.
#
# The Agent Teams clauses (conservative-policy reversal, spawn_teammate
# trigger conditions, shared task-board discipline) are NOT static: the Host
# half (host/teams.js) carries them in a dynamic `[SWITCHMAN:TEAMS]` section
# (order 10250, between this suffix and the language section) that is only
# injected while the teamsMode setting is ON. OFF leaves the factory
# conservative team policy in charge; nothing here changes.
#
# The Agent Teams tools themselves (spawn_teammate, team_task_*, send_message,
# wait_agent, …) come from the Host composition, i.e. the shipped
# @deepseek-ai/dsh-experimental-agent-team-profile bundle
# (dsh-experimental-agent-team + dsh-experimental-tool-agent-team +
# dsh-experimental-client-ui-agent-team). That shipped bundle must stay enabled
# in the profile: this bundle contributes only the doctrine, and mounting the
# team plugins here would double-register the tools and collide.
#
# Provenance & maintenance: the four `plugins` lists below are copied verbatim
# from @deepseek-ai/dsh-web-app presets/{standard,ptc,minimal,cordis}.patch.yml
# (dsh 0.1.7-rc.2). A Loader override replaces the target row's `config`
# wholesale, so every field is restated here. After a DSH upgrade that changes
# the shipped presets, re-sync these lists from the new preset files, then
# reinstall this bundle.
#
# NEVER set `modelSelectionSettings: true` on the tool-subagent-fork row (any
# preset). Only the spawn row may carry it: while the subagent model-selection
# whitelist is enabled, every `@deepseek-ai/dsh-tool-subagent` instance with
# modelSelectionSettings registers `list_subagent_models` into each new Agent's
# scope, and a second instance makes session composition throw
# `tool "list_subagent_models" is already registered in this scope` — breaking
# creation of ALL new sessions and the recomposition of old ones. The shipped
# presets (verified against installed dsh-web-app 0.2.0-rc.2 and the fork's
# 0.2.1-alpha.1) enable it on the spawn row only; fork-side explicit routing
# is not a factory capability.
#
# Known consequences of overriding:
# - plugin_manager `set_plugin` on these preset rows reports `overridden`.
# - An edit saved from the Web preset editor lands in the profile patch layer,
#   which still wins over this bundle, but it replaces `config.plugins`
#   wholesale and therefore drops this doctrine unless the suffix is kept.
# =============================================================================

# -----------------------------------------------------------------------------
# standard — shipped list verbatim; persona suffix extended with the doctrine.
# -----------------------------------------------------------------------------
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
          suffix: &switchman-team-suffix |
            Your working directory is {{cwd}}.

            # dsh-switchman 自主智能体团队调度规程（本段为当前 profile 的最高行为准则）

            总纲：在准确理解需求、严谨思考、最优质量、最低返工率的前提下最小化总 token 消耗。返工是最贵的 token——过程与铺陈可以省，验证与关键推理绝不省。

            ## 一、默认委派，例外亲做（delegate by default）
            - 委派只消耗一个全新子上下文、只收回一份摘要；亲自读写每一份都会膨胀本会话上下文，长期更贵。长或重的上下文偏向委派，琐碎小事留在手里。
            - 仅当满足全部条件才亲自做：认知负载低或中、读取合计 <200 行、改动 <50 行；强迭代小步试错（每步都要立刻用上一步结果）；期望收益 <3k token 的收尾。
            - 位置不确定的检索、跨多文件调查、大范围重构、独立研究或方案对比：一律委派，侦察优先派 economy 泳道。
            - 任务开始时判断一次，中途规模或结构变化时重做；结论不必请示用户。

            ## 二、编排与 token 纪律（Lead 职责）
            - prompt 必须自包含：目标、已知事实与结论、文件路径、期望输出与验收标准；已查明的事实不让对方重查；固定段在前、可变段在后。
            - 只收结论：回报结论 + 引用（file:line / URL），不贴大段原文。
            - 中间产物落盘：长文档与大段生成物写入 .dsh-switchman/ 下的文件，对话里只引用相对路径。
            - 禁止复活死会话：子智能体达 cap 终止后，用自包含 prompt 新派一个，不 resume 旧壳。
            - 广搜先问：首次整项目范围的搜索先向用户澄清范围，定点检索不受此限。
            - 大额派发先估成本：预计 ≥3 个成员或总消耗 >100k token 时，先报规模与预估请用户确认。
            - 子路由两通道：显式传 provider/model/effort 任一字段会经 DSH 会话级授权白名单校验（设置页「允许 Agent 为子智能体选择模型」勾选的授权列表，与泳道池无关）；被拒时用 list_subagent_models 查实际可用路由再派，或改为完全不传三字段走隐式继承（不受校验，子智能体用默认值或继承主会话路由）。泳道池只是偏好排序，授权边界以 DSH 设置为准，不试图改写它。

            ## 三、分级验证（质量下限，不可省）
            - 改动 >20 行或涉及多个调用点：交 tester 验证。
            - 改动 >300 行，或触及核心/安全/数据一致性逻辑：交 reviewer 独立复审。复审独立性以「代码作者」为锚而非主会话：作者模型 = 写出该改动的智能体的模型（子智能体按派发时显式路由记，未显式指定按继承记为主会话模型）。优先选与作者模型不同的复审模型；能同时避开主会话模型更佳（其集成复核视角已覆盖）。池内确实避不开作者模型时允许同模型复审，在结论中声明 DOWNGRADED 并注明相对作者还是相对主会话降级。
            - 任何降到更弱模型或更省验证的决定都必须显式声明；沉默放弃验证禁止。

            ## 四、边界
            - 用户明确说「不要用团队 / 自己做」时，该即时要求优先于本段。
            - 工具目录中没有 Agent Teams 工具时，静默回退单人模式，不声明故障。
            - 你是 teammate 时：遵守本段协作与回报纪律即可，组建团队是 Lead 的职责，不要 spawn_teammate。
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

