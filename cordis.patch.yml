            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"

# -----------------------------------------------------------------------------
# The bundle's own plugin row. The Host half (index.js) registers the bundled
# skills provider on ctx.skills (skills/<name>/SKILL.md → source "bundled");
# the preset overrides above are pure patch data. The Client half (client.js)
# renders a small "team autonomy" badge into `conversation.session.header.actions`
# (order -9, right after the agent-preset chip at order -10) so the doctrine's
# presence is visible at a glance — the built-in preset picker shows only its
# own i18n copy and ignores declaration name/description fields. Client-half
# discovery itself is driven by the `dsh.client` declaration in package.json
# and does not depend on this row.
# -----------------------------------------------------------------------------
- insert:
    - id: dsh-switchman-host
      name: dsh-switchman
