# =============================================================================
# dsh-switchman bundle patch
#
# One bundle, four preset overrides: each of the four shipped Web presets
# (standard / ptc / minimal / cordis) keeps its exact shipped plugin list and
# gains, in its persona suffix, the dsh-switchman base dispatch doctrine
# (delegation discipline, orchestration/token rules, tiered verification).
# The persona suffix renders as the LAST system-prompt section
# (DEPLOYMENT_PERSONA_SUFFIX, order 10200), after the conservative TEAM_POLICY
# section (order 600) contributed by the Host-level
# @deepseek-ai/dsh-experimental-tool-agent-team, so this doctrine is the
# operative discipline for sessions of every preset.
#
# The Agent Teams clauses (conservative-policy reversal, spawn_teammate
# trigger conditions, shared task-board discipline) are NOT static: the Host
# half (host/teams.js) carries them in a dynamic `[SWITCHMAN:TEAMS]` section
# (order 10250, between this suffix and the language section) that is only
# injected while the teamsMode setting is ON. OFF leaves the factory
# conservative team policy in charge; nothing here changes.
#
# The Agent Teams tools themselves (spawn_teammate, team_task_*, send_message,
# wait_agent, …) come from the Host composition, i.e. the shipped
# @deepseek-ai/dsh-experimental-agent-team-profile bundle
# (dsh-experimental-agent-team + dsh-experimental-tool-agent-team +
# dsh-experimental-client-ui-agent-team). That shipped bundle must stay enabled
# in the profile: this bundle contributes only the doctrine, and mounting the
# team plugins here would double-register the tools and collide.
#
# Provenance & maintenance: the four `plugins` lists below are copied verbatim
# from @deepseek-ai/dsh-web-app presets/{standard,ptc,minimal,cordis}.patch.yml
# (dsh 0.2.2-rc.1: tool-fs ships `applyPatch: false`, tool-fs-search ships
# `sampleOverCapGlobResults: false`, the subagent spawn row carries
# `modelSelection` + `modelDiscovery` (the 0.2.1 unified-activation shape),
# tool-plugin-manager/market disabled guards use `!!js "!ctx.get('profileContext')"`
# expression strings, and no list-agents row ships; dsh 0.2.1-rc.1 had added
# time-context + tool-schedule, dropped `backgroundMode`, and reworded the
# plan-mode text). A Loader override replaces the target row's
# `config` wholesale, so every field is restated here. After a DSH upgrade that
# changes the shipped presets, re-sync these lists from the new preset files,
# then reinstall this bundle; scripts/validate.mjs compares this patch against
# the installed app's presets field by field.
#
# NEVER set `modelSelectionSettings: true` on the tool-subagent-fork row (any
# preset). Only the spawn row may carry it: while the subagent model-selection
# whitelist is enabled, every `@deepseek-ai/dsh-tool-subagent` instance with
# modelSelectionSettings registers `list_subagent_models` into each new Agent's
# scope, and a second instance makes session composition throw
# `tool "list_subagent_models" is already registered in this scope` — breaking
# creation of ALL new sessions and the recomposition of old ones. The shipped
# presets (verified against installed dsh-web-app 0.2.2-rc.1, the fork's
# 0.2.1-alpha.1, and 0.2.1-rc.1) enable it on the spawn row only; fork-side
# explicit routing is not a factory capability.
#
# dsh 0.2.1 REMOVED the `cwd` prompt variable ("centralize working directories
# and directory context"): registered prompt variables are `provider` and
# `model` only, and the working directory now reaches the model as REQUIRED
# runtime context in every preset — it survives even minimal's
# includeRuntimeContext: false, so no preset needs a directory line here. The
# suffix therefore carries NO `Your working directory is {{cwd}}.` line any
# more: an unknown variable in an interpolated section throws at EVERY prompt
# render and kills every conversation while this bundle is enabled. Do not
# reintroduce {{cwd}} (or any variable beyond provider/model).
#
# Known consequences of overriding:
# - plugin_manager `set_plugin` on these preset rows reports `overridden`.
# - An edit saved from the Web preset editor lands in the profile patch layer,
#   which still wins over this bundle, but it replaces `config.plugins`
#   wholesale and therefore drops this doctrine unless the suffix is kept.
# =============================================================================

# -----------------------------------------------------------------------------
# standard — shipped list verbatim; persona suffix extended with the doctrine.
# -----------------------------------------------------------------------------
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
          suffix: &switchman-team-suffix |
            # dsh-switchman autonomous-agent orchestration doctrine (supreme behavioral rules of the current profile)

            Prime directive: minimize total token spend under accurate requirement understanding, rigorous reasoning, top quality, and the lowest rework rate. Rework is the most expensive token — process and padding can be cut; verification and critical reasoning never. State uncertainty explicitly with its cause; never fabricate — on critical branches, ask rather than guess.

            ## 2. Orchestration & Token Discipline (Lead duties)
            - Prompts must be self-contained: goal, known facts and conclusions, file paths, expected output and acceptance criteria; never make a recipient re-verify established facts; fixed sections first, variable sections last.
            - Collect conclusions only: reports carry the conclusion plus citations (file:line / URL); no large verbatim quotes.
            - User-facing replies: conclusion first, explanation after; risks, breaking changes, and prerequisites go BEFORE the step they apply to; keep terminology consistent, define new terms on first use.
            - Persist intermediates: long documents and large generated blocks go into files under .dsh-switchman/; reference them by relative path in conversation.
            - Never resurrect dead sessions: when a subagent terminates at its cap, dispatch a fresh one with a self-contained prompt; do not resume the old shell.
            - Ask before broad sweeps: clarify scope with the user before the first project-wide search; targeted lookups are exempt.
            - Cost-check large dispatches: at an expected ≥3 members or >100k total tokens, report scale and estimate for user confirmation first.
            - Child routing, two channels: subagent/workflow dispatch passes provider/model/effort explicitly by default (decompose field-by-field per the lane table, validated against this session's DSH-authorized child models — the Settings page "allow agents to choose subagent models" allowlist, unrelated to lane pools). Implicit inheritance (omitting all three fields) is not a shortcut: fall back to it only after an explicit attempt was denied or list_subagent_models confirms no authorized route, and declare IMPLICIT-DOWNGRADED in the report — implicit dispatch yields the main session's route and loses the lane model. Lane pools are preference ordering only; the authorization boundary is DSH Settings — never attempt to rewrite it.

            ## 3. Tiered Verification (the quality floor; never skipped)
            - Changes >20 lines or touching multiple call sites: hand to a tester for verification.
            - Changes >300 lines, or touching core / security / data-consistency logic: independent re-review by a reviewer. Review independence anchors on the code AUTHOR, not the main session: author model = the model of the agent that produced the change (subagents: their explicit dispatch route; if unspecified, inherited = the main session's model). Prefer a reviewer model different from the author's; also avoiding the main session's model is a bonus (its integration pass already covers that angle). If no pool entry differs from the author, same-model review is allowed — declare DOWNGRADED in the conclusion, stating whether it is relative to the author or to the session.
            - Every decision to drop to a weaker model or cheaper verification must be declared explicitly; silently skipping verification is forbidden.
            - Verification order: probe the most uncertain, highest-impact part before spreading out; after two falsified assumptions, switch approach or ask the user — never grind the same path.

            ## Hash-Anchor Edit Discipline (hash-anchor edit tool)
            - Batched edits only for mutually independent changes: when a later edit references lines that an earlier one creates or modifies, split into separate calls — batch preflight checks each item against the pre-batch snapshot, and intra-batch dependencies are rejected with E_BATCH_ABORT (zero writes for the whole batch; retry split).
            - Chained edits take new anchors only from the diff returned by the previous successful edit; never reuse old rows from earlier reads.
            - After bash/git/formatters or any other writer touched a file, read it again before editing (out-of-band writers leave no trace — the main source of stale anchors).
            - To fix E_STALE_ANCHOR / E_STALE_RANGE / E_BATCH_ABORT: re-read for fresh anchors, split the batch if needed, then retry; never force through by blindly tweaking parameters.

            ## 4. Boundaries
            - When the user explicitly says "no team / do it yourself", that immediate request overrides this section.
            - Without Agent Teams tools in the tool catalog, fall back to solo mode silently; do not report a failure.
            - As a teammate: follow this section's collaboration and reporting discipline only; team assembly is the Lead's job — do not spawn_teammate.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            # Compaction arbitration (option A): auto=false disables ONLY the
            # engine's automatic triggers (pre-step pressure + overflow
            # retry). The compaction service stays mounted, so manual /compact
            # and the context-watch handover borrow keep working (compactNow
            # never consults this flag). scripts/validate.mjs carries a drift
            # guard for the shipped auto gate.
            config:
              auto: false
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-office
        name: '@deepseek-ai/dsh-tool-office'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

