<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="tankClip">
      <rect x="152" y="252" width="336" height="236" rx="24"/>
    </clipPath>
    <clipPath id="pipeClip">
      <rect x="492" y="461" width="306" height="18" rx="9"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <ellipse cx="850" cy="460" rx="700" ry="260" fill="url(#glow)" opacity="0.22"/>

  <!-- horizon ground -->
  <ellipse cx="1150" cy="668" rx="660" ry="96" fill="#0d1929" opacity="0.9"/>
  <!-- stars in the upper sky -->
  <g fill="#e2e8f0">
    <circle cx="720" cy="84" r="2" opacity="0.3"/>
    <circle cx="905" cy="132" r="1.6" opacity="0.22"/>
    <circle cx="1120" cy="70" r="2.2" opacity="0.32"/>
    <circle cx="1300" cy="118" r="1.5" opacity="0.2"/>
    <circle cx="1470" cy="82" r="2" opacity="0.3"/>
    <circle cx="1548" cy="176" r="1.6" opacity="0.22"/>
    <circle cx="1210" cy="176" r="1.4" opacity="0.18"/>
    <circle cx="880" cy="226" r="1.5" opacity="0.16"/>
    <circle cx="1020" cy="182" r="1.3" opacity="0.15"/>
    <circle cx="1400" cy="230" r="1.6" opacity="0.2"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="132" font-size="46" font-weight="700">
    <tspan fill="#cbd5e1">dsh-</tspan><tspan fill="#7dd3fc">switchman</tspan>
  </text>
  <text x="84" y="176" font-size="21" fill="#8aa0b8">Context on a meter. Tasks dispatch themselves.</text>

  <!-- soft / hard watermark guides (left of tank) -->
  <rect x="56" y="337" width="94" height="26" rx="13" fill="#fbbf2415" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="103" y="354" font-size="12" fill="#fbbf24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SOFT 60%</text>
  <line x1="150" y1="350" x2="488" y2="350" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" opacity="0.9"/>
  <rect x="56" y="292" width="94" height="26" rx="13" fill="#f8717115" stroke="#f87171" stroke-width="1.5"/>
  <text x="103" y="309" font-size="12" fill="#f87171" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HARD 80%</text>
  <line x1="150" y1="305" x2="488" y2="305" stroke="#f87171" stroke-width="2" stroke-dasharray="8 6" opacity="0.9"/>

  <!-- context tank -->
  <rect x="150" y="250" width="340" height="240" rx="26" fill="#94c5fd0d" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="2"/>
  <g clip-path="url(#tankClip)">
    <rect x="150" y="345" width="340" height="145" fill="url(#water)"/>
    <circle cx="220" cy="420" r="4" fill="#bae6fd" opacity="0.35"/>
    <circle cx="300" cy="440" r="3" fill="#bae6fd" opacity="0.3"/>
    <circle cx="380" cy="410" r="5" fill="#bae6fd" opacity="0.35"/>
    <circle cx="260" cy="382" r="3" fill="#bae6fd" opacity="0.3"/>
    <rect x="150" y="452" width="340" height="38" fill="#075985" opacity="0.35"/>
  </g>
  <ellipse cx="320" cy="345" rx="168" ry="12" fill="#7dd3fc" opacity="0.55"/>
  <path d="M162 344 Q320 332 478 344" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.45"/>
  <ellipse cx="320" cy="250" rx="170" ry="26" fill="#0f2740" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="2"/>
  <ellipse cx="320" cy="250" rx="148" ry="17" fill="#16233c" stroke="#38bdf8" stroke-opacity="0.25"/>
  <!-- level scale on tank wall -->
  <g stroke="#64748b" stroke-width="2" opacity="0.6">
    <line x1="470" y1="463" x2="484" y2="463"/>
    <line x1="470" y1="440" x2="484" y2="440"/>
    <line x1="470" y1="417" x2="484" y2="417"/>
    <line x1="470" y1="395" x2="484" y2="395"/>
    <line x1="464" y1="372" x2="484" y2="372"/>
    <line x1="470" y1="327" x2="484" y2="327"/>
    <line x1="470" y1="305" x2="484" y2="305"/>
    <line x1="470" y1="282" x2="484" y2="282"/>
    <line x1="470" y1="260" x2="484" y2="260"/>
  </g>

  <!-- sight glass (water gauge) -->
  <rect x="490" y="290" width="34" height="8" fill="url(#steel)"/>
  <rect x="490" y="430" width="34" height="8" fill="url(#steel)"/>
  <rect x="520" y="280" width="36" height="206" rx="10" fill="#7dd3fc0f" stroke="#7dd3fc" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="524" y="345" width="28" height="137" rx="6" fill="url(#water)" opacity="0.9"/>
  <circle cx="538" cy="345" r="9" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="524" y="272" width="28" height="10" rx="3" fill="#64748b"/>
  <rect x="524" y="484" width="28" height="10" rx="3" fill="#64748b"/>
  <!-- float linkage to valve -->
  <line x1="538" y1="337" x2="556" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <line x1="556" y1="290" x2="644" y2="410" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="556" cy="290" r="5" fill="#94a3b8"/>

  <!-- outflow pipe with water inside -->
  <rect x="490" y="458" width="310" height="24" rx="12" fill="url(#steel)" stroke="#475569" stroke-width="1.5"/>
  <g clip-path="url(#pipeClip)">
    <rect x="490" y="463" width="310" height="14" fill="url(#water)" opacity="0.9"/>
  </g>
  <rect x="560" y="452" width="10" height="36" rx="3" fill="#64748b"/>
  <rect x="700" y="452" width="10" height="36" rx="3" fill="#64748b"/>
  <!-- valve wheel driven by the float -->
  <rect x="648" y="428" width="8" height="30" fill="#64748b"/>
  <circle cx="652" cy="414" r="26" fill="none" stroke="#ef4444" stroke-width="6"/>
  <line x1="652" y1="388" x2="652" y2="440" stroke="#ef4444" stroke-width="4"/>
  <line x1="626" y1="414" x2="678" y2="414" stroke="#ef4444" stroke-width="4"/>
  <circle cx="652" cy="414" r="6" fill="#ef4444"/>
  <!-- level gauge on the line -->
  <rect x="764" y="440" width="8" height="18" fill="url(#steel)"/>
  <circle cx="768" cy="410" r="30" fill="#0f172a" stroke="#7dd3fc" stroke-width="2.5"/>
  <line x1="748" y1="398" x2="754" y2="402" stroke="#64748b" stroke-width="2"/>
  <line x1="768" y1="384" x2="768" y2="391" stroke="#64748b" stroke-width="2"/>
  <line x1="788" y1="398" x2="782" y2="402" stroke="#64748b" stroke-width="2"/>
  <line x1="768" y1="410" x2="784" y2="392" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="768" cy="410" r="4" fill="#fbbf24"/>

  <!-- downpipe into the hydraulic actuator -->
  <rect x="794" y="470" width="24" height="74" fill="url(#steel)" stroke="#475569" stroke-width="1.5"/>
  <rect x="798" y="474" width="16" height="66" fill="url(#water)" opacity="0.9"/>
  <rect x="782" y="546" width="96" height="28" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="866" y="552" width="46" height="16" rx="8" fill="url(#steel)" stroke="#475569"/>
  <line x1="912" y1="560" x2="992" y2="552" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <rect x="776" y="574" width="20" height="8" rx="3" fill="#475569"/>
  <rect x="866" y="574" width="20" height="8" rx="3" fill="#475569"/>

  <!-- the switchman at work, behind the main rail -->
  <g>
    <ellipse cx="1060" cy="558" rx="58" ry="9" fill="#16233c"/>
    <!-- switch stand -->
    <line x1="1010" y1="554" x2="1010" y2="500" stroke="#94a3b8" stroke-width="5"/>
    <circle cx="1010" cy="492" r="5" fill="#22d3ee"/>
    <circle cx="1010" cy="492" r="9" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4"/>
    <rect x="1004" y="500" width="12" height="10" rx="3" fill="#64748b"/>
    <!-- legs -->
    <line x1="1052" y1="514" x2="1046" y2="552" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="1066" y1="514" x2="1072" y2="552" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <rect x="1038" y="548" width="16" height="7" rx="3" fill="#1e293b"/>
    <rect x="1066" y="548" width="16" height="7" rx="3" fill="#1e293b"/>
    <!-- vest -->
    <rect x="1040" y="470" width="36" height="50" rx="11" fill="#fb923c"/>
    <line x1="1046" y1="486" x2="1070" y2="486" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <line x1="1046" y1="500" x2="1070" y2="500" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <!-- head + cap -->
    <circle cx="1058" cy="452" r="12" fill="#fcd9b8"/>
    <path d="M1044 450 a14 14 0 0 1 28 0 z" fill="#0ea5e9"/>
    <rect x="1056" y="446" width="17" height="4" rx="2" fill="#0284c7"/>
    <!-- arms pulling the stand lever -->
    <line x1="1044" y1="482" x2="1016" y2="502" stroke="#fcd9b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="1074" y1="482" x2="1018" y2="506" stroke="#fcd9b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1016" cy="502" r="4" fill="#eab308"/>
  </g>

  <!-- track junction -->
  <polygon points="985,542 985,558 1010,550" fill="#475569"/>
  <g stroke="#475569" stroke-width="5" opacity="0.9">
    <line x1="1030" y1="534" x2="1030" y2="566"/>
    <line x1="1080" y1="534" x2="1080" y2="566"/>
    <line x1="1130" y1="535" x2="1130" y2="565"/>
    <line x1="1190" y1="537" x2="1190" y2="563"/>
    <line x1="1260" y1="539" x2="1260" y2="561"/>
    <line x1="1340" y1="541" x2="1340" y2="559"/>
    <line x1="1430" y1="543" x2="1430" y2="557"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round">
    <path d="M995 550 H1520"/>
    <path d="M995 550 C1140 550 1230 380 1520 380"/>
    <path d="M995 550 C1140 550 1230 612 1520 612"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="12 10">
    <path d="M995 550 H1520"/>
    <path d="M995 550 C1140 550 1230 380 1520 380"/>
    <path d="M995 550 C1140 550 1230 612 1520 612"/>
  </g>
  <!-- active blade pointing to main -->
  <line x1="995" y1="550" x2="1120" y2="550" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- ctx cart on the main line -->
  <rect x="1272" y="514" width="56" height="30" rx="7" fill="#164e63" fill-opacity="0.85" stroke="#22d3ee" stroke-width="2"/>
  <text x="1300" y="534" font-size="14" fill="#a5f3fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ctx</text>
  <circle cx="1286" cy="548" r="5" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="1314" cy="548" r="5" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

  <!-- destination pools -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">
    <rect x="1408" y="358" width="112" height="44" rx="10" fill="#0b1526" stroke="#a78bfa" stroke-width="2"/>
    <text x="1464" y="385" fill="#ddd6fe">hard</text>
    <rect x="1408" y="528" width="112" height="44" rx="10" fill="#0b1526" stroke="#22d3ee" stroke-width="2"/>
    <text x="1464" y="555" fill="#a5f3fc">main</text>
    <rect x="1408" y="590" width="112" height="44" rx="10" fill="#0b1526" stroke="#fbbf24" stroke-width="2"/>
    <text x="1464" y="617" fill="#fde68a">economy</text>
  </g>

  <!-- the "ox & horse" (hard-working programmers) watching from the hill -->
  <g>
    <ellipse cx="1330" cy="322" rx="150" ry="28" fill="#1c2c4a"/>
    <path d="M1180 322 A150 28 0 0 1 1480 322" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.22"/>
    <g fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.55">
      <path d="M1230 310 q-2 -8 -5 -10 M1230 310 q0 -10 0 -13 M1230 310 q3 -8 6 -10"/>
      <path d="M1340 302 q-2 -8 -5 -10 M1340 302 q0 -10 0 -13 M1340 302 q3 -8 6 -10"/>
      <path d="M1440 308 q-2 -8 -5 -10 M1440 308 q0 -10 0 -13 M1440 308 q3 -8 6 -10"/>
    </g>
    <!-- ox (chubby, sitting with a slight forward tilt, facing left) -->
    <g transform="rotate(-6 1268 286)">
      <ellipse cx="1268" cy="286" rx="44" ry="38" fill="#f1f5f9"/>
      <circle cx="1282" cy="282" r="12" fill="#94a3b8" opacity="0.5"/>
      <ellipse cx="1300" cy="314" rx="16" ry="9" fill="#dbe4ee"/>
      <rect x="1240" y="316" width="12" height="14" rx="5" fill="#dbe4ee"/>
      <rect x="1258" y="316" width="12" height="14" rx="5" fill="#dbe4ee"/>
      <path d="M1308 272 q16 -2 12 18" fill="none" stroke="#dbe4ee" stroke-width="4" stroke-linecap="round"/>
      <!-- ox head -->
      <circle cx="1234" cy="248" r="17" fill="#f8fafc"/>
      <ellipse cx="1223" cy="254" rx="11" ry="8" fill="#f3b6c0"/>
      <circle cx="1221" cy="253" r="1.8" fill="#be6b78" opacity="0.8"/>
      <circle cx="1230" cy="243" r="2.2" fill="#0f172a"/>
      <path d="M1222 234 q-10 -12 -19 -5" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
      <path d="M1243 231 q3 -14 15 -12" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="1218" cy="241" rx="5" ry="3" fill="#dbe4ee" transform="rotate(-25 1218 241)"/>
      <ellipse cx="1248" cy="234" rx="5" ry="3" fill="#dbe4ee" transform="rotate(20 1248 234)"/>
    </g>
    <!-- horse (sitting like a dog, slim, facing left) -->
    <circle cx="1428" cy="296" r="28" fill="#a16207"/>
    <rect x="1391" y="242" width="38" height="78" rx="17" fill="#b45309"/>
    <rect x="1396" y="312" width="8" height="14" rx="4" fill="#92400e"/>
    <rect x="1408" y="312" width="8" height="14" rx="4" fill="#92400e"/>
    <path d="M1454 288 q20 0 16 24" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M1468 308 q6 6 2 14" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- horse neck + head -->
    <path d="M1400 256 L1372 222" fill="none" stroke="#b45309" stroke-width="22" stroke-linecap="round"/>
    <path d="M1400 250 Q1408 234 1396 220" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="1366" cy="214" rx="14" ry="10" fill="#b45309"/>
    <ellipse cx="1353" cy="218" rx="8" ry="6" fill="#d6b28a"/>
    <circle cx="1363" cy="211" r="2" fill="#0f172a"/>
    <path d="M1372 205 l4 -13 8 10 z" fill="#92400e"/>
    <path d="M1380 208 l8 -11 4 12 z" fill="#92400e"/>
    <!-- little "..." above their heads: just watching -->
    <circle cx="1300" cy="234" r="2.5" fill="#94a3b8" opacity="0.8"/>
    <circle cx="1312" cy="226" r="2.5" fill="#94a3b8" opacity="0.55"/>
    <circle cx="1326" cy="220" r="2.5" fill="#94a3b8" opacity="0.3"/>
  </g>
</svg>
